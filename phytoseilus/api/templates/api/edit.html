<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Edit batch</title>

    <style>
        body {
            margin: 0;
            font-family: Segoe UI, sans-serif;
            background: #f4f7f3;
            color: #18312b;
        }

        main {
            max-width: 760px;
            margin: 32px auto;
            padding: 26px;
            background: white;
            border: 1px solid #dce7df;
            border-radius: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .full {
            grid-column: 1 / -1;
        }

        input,
        select,
        textarea {
            padding: 11px;
            border: 1px solid #ccd9cf;
            border-radius: 8px;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .button {
            padding: 11px 16px;
            border-radius: 8px;
            border: 0;
            background: #1e6b45;
            color: white;
            text-decoration: none;
        }

        .secondary {
            background: #edf3ef;
            color: #18312b;
        }

        @media (max-width: 650px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Edit batch {{ record.batch_number }}</h1>

        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="grid">
                <div class="field">
                    <label>Supplier name</label>
                    <input name="supplier_name" value="{{ record.supplier_name }}" required>
                </div>

                <div class="field">
                    <label>Supplier reference</label>
                    <input name="supplier_reference" value="{{ record.supplier_reference }}">
                </div>

                <div class="field">
                    <label>Batch number</label>
                    <input name="batch_number" value="{{ record.batch_number }}" required>
                </div>

                <div class="field">
                    <label>Number of tubs</label>
                    <input
                        name="number_of_tubs"
                        type="number"
                        min="1"
                        value="{{ record.number_of_tubs }}"
                        required
                    >
                </div>

                <div class="field">
                    <label>Live predators</label>
                    <input
                        name="live_predators"
                        type="number"
                        min="0"
                        value="{{ record.live_predators }}"
                        required
                    >
                </div>

                <div class="field">
                    <label>Live preys</label>
                    <input
                        name="live_preys"
                        type="number"
                        min="0"
                        value="{{ record.live_preys }}"
                        required
                    >
                </div>

                <div class="field">
                    <label>Dead predators</label>
                    <input
                        name="dead_predators"
                        type="number"
                        min="0"
                        value="{{ record.dead_predators }}"
                    >
                </div>

                <div class="field">
                    <label>Dead preys</label>
                    <input
                        name="dead_preys"
                        type="number"
                        min="0"
                        value="{{ record.dead_preys }}"
                    >
                </div>

                <div class="field">
                    <label>Contaminant</label>
                    <input name="contaminant" value="{{ record.contaminant }}">
                </div>

                <div class="field">
                    <label>Contamination level</label>
                    <input
                        name="contamination_level"
                        type="number"
                        min="0"
                        step="0.01"
                        value="{{ record.contamination_level }}"
                    >
                </div>

                <div class="field full">
                    <label>Status</label>
                    <select name="status">
                        <option value="pending" {% if record.status == 'pending' %}selected{% endif %}>
                            Pending inspection
                        </option>
                        <option value="accepted" {% if record.status == 'accepted' %}selected{% endif %}>
                            Accepted
                        </option>
                        <option value="rejected" {% if record.status == 'rejected' %}selected{% endif %}>
                            Rejected
                        </option>
                    </select>
                </div>

                <div class="field full">
                    <label>Comments</label>
                    <textarea name="comments" rows="4">{{ record.comments }}</textarea>
                </div>
            </div>

            <div class="actions">
                <a
                    class="button secondary"
                    href="{% url 'received_predator_detail' record.pk %}"
                >
                    Cancel
                </a>

                <button class="button" type="submit">
                    Save changes
                </button>
            </div>
        </form>
    </main>
</body>
</html>
